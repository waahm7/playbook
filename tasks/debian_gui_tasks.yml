---
# Desktop GUI setup for Ubuntu / GNOME (Wayland).
# Included from setup.yml only when the GUI environment variable is 1.
#
# The Adv360 keyboard emits LGUI-based chords, and LGUI = Cmd on macOS / Super on
# Linux, so the SAME keyboard layers are used on both OSes:
#   Cmd+C/V/...                    editing     -> Toshy translates to Ctrl on Linux
#   Super+Ctrl+Shift + W/R/T/G/E   app focus   -> Firefox/Slack/VS Code/Claude/Ghostty
#   Super+Space                    launcher    -> Ulauncher
#   Super+Shift+C                  clipboard   -> CopyQ
# The dconf bindings below are all Super based, but the Super chords do NOT
# reach GNOME untouched while Toshy runs. Toshy classifies the Adv360 as an
# Apple keyboard (set per device in its own config), which swaps LGUI to Ctrl
# and physical Ctrl to Super. The app focus chords survive that swap because
# they hold both keys, so the modifier set is unchanged. Single modifier LGUI
# chords do not survive, so Super+Space and Super+Shift+C need explicit
# passthrough entries in Toshy's "user_apps" slice. Toshy is installed by hand;
# see the note further down.

# apt_repository cannot add a ppa: source on releases that dropped apt-key. Its
# fallback runs "gpg --keyserver ... --export", but export only dumps keys that
# are already in the local keyring and never fetches from the keyserver, so it
# always fails with "Unable to get required signing key". Fetch the key and
# declare the source explicitly instead.
- name: Fetch Ulauncher PPA signing key
  become: true
  ansible.builtin.get_url:
    url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x{{ ulauncher_ppa_key }}"
    dest: /etc/apt/keyrings/ulauncher.asc
    owner: root
    group: root
    mode: '0644'
  vars:
    ulauncher_ppa_key: 59EBDE772980C381CA13FA59FAF1020699503176
  tags: gui

- name: Add Ulauncher PPA
  become: true
  ansible.builtin.deb822_repository:
    name: ulauncher
    types: deb
    uris: https://ppa.launchpadcontent.net/agornostal/ulauncher/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: /etc/apt/keyrings/ulauncher.asc
    state: present
  tags: gui

- name: Install desktop GUI packages
  become: true
  ansible.builtin.apt:
    name:
      - ulauncher
      - copyq
      - gnome-shell-extension-manager
    state: present
    update_cache: true
  tags: gui

# GUI apps mirroring the macOS Homebrew casks. Ghostty is in the official Ubuntu
# repos on 26.04+. Alfred is replaced by Ulauncher; Claude Desktop and NordVPN
# are installed from their own apt repos below. Logi Options+ has no Linux build;
# the MX Ergo S pointer speed and natural scroll are handled via GNOME dconf
# below (Solaar omitted for now -- add it if you need hardware button remaps).
- name: Install GUI applications
  become: true
  ansible.builtin.apt:
    name:
      - vlc
      - firefox
      - ghostty
      - qbittorrent
    state: present
  tags: gui

# Claude Desktop for Linux (beta) from Anthropic's apt repo, so updates arrive
# with normal apt upgrades. Requires Ubuntu 22.04+/Debian 12+, amd64/arm64.
- name: Add Claude Desktop signing key
  become: true
  ansible.builtin.get_url:
    url: https://downloads.claude.ai/claude-desktop/key.asc
    dest: /usr/share/keyrings/claude-desktop-archive-keyring.asc
    mode: "0644"
  tags: gui

- name: Add Claude Desktop apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/claude-desktop-archive-keyring.asc] https://downloads.claude.ai/claude-desktop/apt/stable stable main"
    filename: claude-desktop
    state: present
  tags: gui

- name: Install Claude Desktop
  become: true
  ansible.builtin.apt:
    name: claude-desktop
    state: present
    update_cache: true
  tags: gui

# NordVPN official Linux client from NordVPN's apt repo (updates via apt upgrade).
- name: Add NordVPN signing key
  become: true
  ansible.builtin.get_url:
    url: https://repo.nordvpn.com/gpg/nordvpn_public.asc
    dest: /usr/share/keyrings/nordvpn-archive-keyring.asc
    mode: "0644"
  tags: gui

- name: Add NordVPN apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/nordvpn-archive-keyring.asc] https://repo.nordvpn.com/deb/nordvpn/debian stable main"
    filename: nordvpn
    state: present
  tags: gui

- name: Install NordVPN
  become: true
  ansible.builtin.apt:
    name: nordvpn
    state: present
    update_cache: true
  tags: gui

# Lets you run nordvpn without sudo (takes effect after a re-login).
- name: Add user to the nordvpn group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_env.USER }}"
    groups: nordvpn
    append: true
  tags: gui

# Toshy (the macOS style Cmd editing layer) is installed by hand, not here. Its
# setup_toshy.py always prompts for admin confirmation, deliberately clears the
# sudo ticket, and on GNOME Wayland demands a randomly generated secret code, so
# it cannot run unattended. Install it in a terminal:
#   git clone https://github.com/RedBearAK/toshy.git ~/.local/share/toshy-src
#   cd ~/.local/share/toshy-src && ./setup_toshy.py install
# On GNOME Wayland it also needs ONE compatible shell extension for focused
# window detection (Xremap, Window Calls Extended, or Focused Window D-Bus),
# installable via the Extension Manager set up above.

# --- Run or Raise: focus-or-launch app shortcuts (works on Wayland) ---------

- name: Install Run or Raise GNOME extension
  ansible.builtin.git:
    repo: https://github.com/CZ-NIC/run-or-raise.git
    dest: "{{ ansible_env.HOME }}/.local/share/gnome-shell/extensions/run-or-raise@edvard.cz"
  tags: gui

# GNOME Shell only discovers a newly cloned extension in a fresh session, so on
# the run that first clones it this cannot succeed. Tolerating that is correct,
# but it must not pass silently: an extension that is present yet disabled looks
# exactly like a working setup until every shortcut turns out to be dead.
- name: Enable Run or Raise extension
  ansible.builtin.command: gnome-extensions enable run-or-raise@edvard.cz
  register: ror_enable
  changed_when: false
  failed_when: false
  tags: gui

- name: Report that Run or Raise still needs enabling
  ansible.builtin.debug:
    msg: >
      Run or Raise could not be enabled yet (this is expected on a first
      install). Log out and back in, then re-run the playbook or run
      "gnome-extensions enable run-or-raise@edvard.cz" by hand. The app focus
      shortcuts stay dead until it reports State: ACTIVE.
  when: ror_enable.rc != 0
  tags: gui

# ansible.builtin.copy will not create missing parent directories, and a fresh
# GNOME account has neither of these until something writes to them.
- name: Ensure GUI config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ ansible_env.HOME }}/.config/run-or-raise"
    - "{{ ansible_env.HOME }}/.config/autostart"
  tags: gui

- name: Configure Run or Raise app shortcuts
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.config/run-or-raise/shortcuts.conf"
    mode: "0644"
    # Format: shortcut,launch command,wm_class,title
    content: |
      <Super><Control><Shift>w,firefox,firefox,
      <Super><Control><Shift>r,slack,Slack,
      <Super><Control><Shift>t,code,Code,
      <Super><Control><Shift>g,claude-desktop,Claude,
      <Super><Control><Shift>e,ghostty,com.mitchellh.ghostty,
  tags: gui

# --- Autostart launcher + clipboard manager --------------------------------

- name: Autostart Ulauncher
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.config/autostart/ulauncher.desktop"
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      Name=Ulauncher
      Exec=ulauncher --hide-window --no-window-shadow
      X-GNOME-Autostart-enabled=true
  tags: gui

- name: Autostart CopyQ
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.config/autostart/copyq.desktop"
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      Name=CopyQ
      Exec=copyq
      X-GNOME-Autostart-enabled=true
  tags: gui

# --- GNOME custom keybindings for launcher + clipboard ---------------------
# These actions do not need window focus, so plain dconf shortcuts work on Wayland.

# Free Super+Space (GNOME's default switch-input-source) for Ulauncher, which the
# keyboard's Cmd+Space maps to.
- name: Clear Super+Space switch-input-source binding
  community.general.dconf:
    key: /org/gnome/desktop/wm/keybindings/switch-input-source
    value: "@as []"
    state: present
  tags: gui

- name: Register custom keybinding paths
  community.general.dconf:
    key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings
    value: "['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/ulauncher/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/copyq/']"
    state: present
  tags: gui

# Bound to Super+Space, which the keyboard emits for Cmd+Space.
- name: Configure Ulauncher toggle keybinding (Cmd+Space)
  community.general.dconf:
    key: "/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/ulauncher/{{ item.k }}"
    value: "{{ item.v }}"
    state: present
  loop:
    - { k: name, v: "'Ulauncher'" }
    - { k: command, v: "'ulauncher-toggle'" }
    - { k: binding, v: "'<Super>space'" }
  tags: gui

# Bound to Super+Shift+C, which the keyboard emits for Cmd+Shift+C (matches Alfred).
- name: Configure CopyQ clipboard-history keybinding (Super+Shift+C)
  community.general.dconf:
    key: "/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/copyq/{{ item.k }}"
    value: "{{ item.v }}"
    state: present
  loop:
    - { k: name, v: "'CopyQ'" }
    - { k: command, v: "'copyq toggle'" }
    - { k: binding, v: "'<Super><Shift>c'" }
  tags: gui

# --- MX Ergo S trackball, mirroring Logi Options+ --------------------------
# Natural scroll is an exact match. Pointer speed: both sliders share a midpoint
# default (Options+ 50% <-> GNOME 0.0), so gnome_speed = (percent - 50) / 50.
# Options+ 65% -> (65-50)/50 = 0.3. NOTE this matches slider POSITION, not actual
# speed -- Options+ drives hardware DPI while GNOME is a software accel factor, so
# tune to taste. For a faithful hardware match you could install Solaar and set
# its "Pointer Speed" (same setting Options+ changes), then set this back to 0.
# There is no Wayland equivalent for the Options+ scroll-SPEED slider.
- name: Configure trackball natural scroll (matches Options+)
  community.general.dconf:
    key: /org/gnome/desktop/peripherals/mouse/natural-scroll
    value: "true"
    state: present
  tags: gui

- name: Configure trackball pointer speed (~65%)
  community.general.dconf:
    key: /org/gnome/desktop/peripherals/mouse/speed
    value: "0.3"
    state: present
  tags: gui
