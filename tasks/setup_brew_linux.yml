# Homebrew on Linux (x86_64), so CLI tools stay in sync with macOS and upgrade
# with a single `brew upgrade`. Casks are macOS-only, so GUI apps stay on apt.
- name: Install Homebrew build dependencies (Debian)
  become: true
  ansible.builtin.apt:
    name:
      - build-essential
      - procps
      - curl
      - file
      - git
    state: present
  when: ansible_os_family == 'Debian'
  tags: always

- name: Check if Homebrew is installed
  ansible.builtin.stat:
    path: /home/linuxbrew/.linuxbrew/bin/brew
  register: brew_bin
  tags: always

# Under NONINTERACTIVE the installer probes sudo with "sudo -n", which cannot
# prompt and so always fails from Ansible. Passing -K does not help: that
# password goes to Ansible's own become, never to the installer's inner sudo.
# The installer skips sudo entirely when the prefix is already writable, so
# create it here and hand ownership to the user first.
- name: Create Homebrew prefix owned by the user
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: '0755'
  loop:
    - /home/linuxbrew
    - /home/linuxbrew/.linuxbrew
  when: not brew_bin.stat.exists
  tags: always

- name: Install Homebrew
  ansible.builtin.shell:
    cmd: >
      NONINTERACTIVE=1 /bin/bash -c
      "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  when: not brew_bin.stat.exists
  tags: always

# Mirrors the macOS `brew leaves` CLI tools. `brew upgrade` keeps them current.
- name: Install Homebrew packages
  community.general.homebrew:
    name:
      - neovim
      - fzf
      - ripgrep
      - tmux
    state: present
    path: /home/linuxbrew/.linuxbrew/bin
  tags: always
