---
- name: Setup Development Environment
  hosts: localhost
  vars:
    os: "{{ ansible_os_family | lower }}"
    config_path: "{{ lookup('env', 'HOME') }}/configurations"
    src_key: "./ssh/id_ed25519_vault"
    dest_key: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519"
  tasks:
    # Ubuntu ships sudo-rs as the default sudo. It rewrites the custom prompt
    # Ansible passes via -p into "[sudo: <prompt>] Password:", so Ansible never
    # matches the prompt it is waiting for and every become task dies with
    # "Timed out waiting for become success or become password prompt".
    # Classic sudo stays installed as /usr/bin/sudo.ws, so use it when present.
    - name: Check for classic sudo
      ansible.builtin.stat:
        path: /usr/bin/sudo.ws
      register: classic_sudo
      tags: always
    - name: Use classic sudo for privilege escalation
      ansible.builtin.set_fact:
        ansible_become_exe: /usr/bin/sudo.ws
      when: classic_sudo.stat.exists
      tags: always
    - name: install ssh
      ansible.builtin.include_tasks: "tasks/ssh.yml"
      tags:
        - dotfiles
        - ssh
        - git
    # - name: setup rust
    #   ansible.builtin.include_tasks: "tasks/setup_rust.yml"
    #   tags:
    #     - rust
    - name: Install git repositories
      ansible.builtin.include_tasks: "tasks/setup_git_and_repos.yml" 
      tags: 
        - git
        - dotfiles
    - name: Link dotfiles
      ansible.builtin.include_tasks: "tasks/link_dotfiles.yml"
      tags: 
        - dotfiles
    - name: Link Scripts
      ansible.builtin.include_tasks: "tasks/link_scripts.yml"
      tags: 
        - dotfiles 
    - name: Include OS specific tasks
      ansible.builtin.include_tasks: "tasks/{{ os }}_tasks.yml"
      tags: 
        - os
    # Installs oh-my-zsh which depends upon zsh which is installed by os specific tasks
    - name: Include Common OS Tasks 
      ansible.builtin.include_tasks: "tasks/common_os_tasks.yml"
      tags: 
        - os
    # Installs Homebrew + CLI tools (nvim, fzf, ripgrep, tmux) on Linux
    - name: Include Linux Tasks
      ansible.builtin.include_tasks: "tasks/linux_tasks.yml"
      when: >
        ansible_facts['os_family'] in ['Debian', 'RedHat', 'Archlinux', 'Alpine']
      tags: 
        - os
    - name: Setup Desktop GUI (Ulauncher, CopyQ, app hotkeys)
      ansible.builtin.include_tasks: "tasks/debian_gui_tasks.yml"
      when: >
        ansible_facts['os_family'] == 'Debian'
        and (
          (lookup('env', 'GUI') | default('', true) | lower in ['1', 'true', 'yes'])
          or (lookup('env', 'gui') | default('', true) | lower in ['1', 'true', 'yes'])
        )
      tags:
        - gui
#    - name: Enable fzf-tab
#      shell: |
#        source ~/.zshrc && enable-fzf-tab
#      args:
#        executable: /bin/zsh
#      tags:
#        - fzf
    - name: Setup Fonts 
      ansible.builtin.include_tasks: "tasks/fonts.yml"
      tags: 
        - fonts 
